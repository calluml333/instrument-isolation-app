name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (markdown lint + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --hidden --max-retries 3 --accept 200,429 "**/*.md"
          fail: true

  python:
    name: Python (lint, format, tests)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with .devcontainer/post-create.sh.
      POETRY_VERSION: "2.5.1"
    steps:
      - uses: actions/checkout@v7

      # Poetry must be on PATH before setup-python so it can cache the
      # in-project .venv (poetry.toml), keyed on poetry.lock.
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      - name: Check lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pytest
        run: poetry run pytest
